<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background: Brand deep teal gradient matching Berhan Stock theme -->
    <linearGradient id="brandBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e4d5d" />
      <stop offset="45%" stop-color="#173d4a" />
      <stop offset="100%" stop-color="#0e262f" />
    </linearGradient>

    <!-- Top Box: Illuminated golden-light facet ("Berhan") -->
    <linearGradient id="berhanGlow" x1="7" y1="3" x2="17" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.85" />
    </linearGradient>

    <!-- Left Box: Vibrant Cyan/Teal -->
    <linearGradient id="tealBox" x1="2" y1="11" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Right Box: Deep Azure/Teal -->
    <linearGradient id="darkTealBox" x1="12" y1="11" x2="22" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.75" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="boxShadow" x="8" y="10" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="64" height="64" rx="16" fill="url(#brandBg)" />
  
  <!-- Subtle Highlight Border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <!-- Boxes Geometry with Brand Illumination -->
  <g filter="url(#boxShadow)" transform="translate(10.5, 10.5) scale(1.79)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Box ("Berhan" / Radiant Light) -->
    <path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z" fill="url(#berhanGlow)" stroke="#ffffff" stroke-width="1.8" />
    <path d="M12 8 7.26 5.15" stroke="#ffffff" stroke-width="1.8" />
    <path d="m12 8 4.74-2.85" stroke="#ffffff" stroke-width="1.8" />
    <path d="M12 13.5V8" stroke="#ffffff" stroke-width="1.8" />

    <!-- Bottom Left Box (Stock Inventory) -->
    <path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z" fill="url(#tealBox)" stroke="#ffffff" stroke-width="1.8" />
    <path d="m7 16.5-4.74-2.85" stroke="#ffffff" stroke-width="1.8" />
    <path d="m7 16.5 5-3" stroke="#ffffff" stroke-width="1.8" />
    <path d="M7 16.5v5.17" stroke="#ffffff" stroke-width="1.8" />

    <!-- Bottom Right Box (Stock Inventory) -->
    <path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z" fill="url(#darkTealBox)" stroke="#ffffff" stroke-width="1.8" />
    <path d="m17 16.5-5-3" stroke="#ffffff" stroke-width="1.8" />
    <path d="m17 16.5 4.74-2.85" stroke="#ffffff" stroke-width="1.8" />
    <path d="M17 16.5v5.17" stroke="#ffffff" stroke-width="1.8" />
  </g>
</svg>